<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#F7F6F3">
<title>The Buy-In Bowl — Archive</title>
<meta name="description" content="The Buy-In Bowl archive: champions, standings, rosters, trades and league chat from every season.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <button type="button" class="wordmark" id="mark">The Buy-In <span>Bowl</span></button>
    <nav id="nav" aria-label="Seasons"></nav>
  </div>
</header>

<main id="app"></main>

<footer class="site">
  <div class="wrap">
    Private league archive. Maintained by Johannes.
  </div>
</footer>

<script src="data/league.js"></script>
<script src="data/season-2025.js"></script>
<script src="data/season-2026.js"></script>
<script src="assets/app.js"></script>
<script data-intern-nav>
(function(){var n=document.getElementById('nav');if(!n)return;
function add(){if(n.querySelector('[data-intern]'))return;var b=document.createElement('button');
b.type='button';b.setAttribute('data-intern','');b.textContent='Intern';
b.onclick=function(){location.href='intern/';};n.appendChild(b);}
add();new MutationObserver(add).observe(n,{childList:true});})();
</script>
</body>
</html>
